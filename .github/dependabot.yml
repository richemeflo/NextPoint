version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
      react-native:
        patterns:
          - react-native
          - react-native-*
          - "@react-native/*"
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
